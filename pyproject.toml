[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lerobot-webrtc"
version = "0.1.0"
description = "LeRobot SO-100/SO-101 and B601-RS joint-position transport over WebRTC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["aiortc>=1.15,<2", "aiohttp>=3.14.4,<4"]

[project.optional-dependencies]
hardware = ["lerobot[feetech]==0.6.1"]
b601 = ["motorbridge==0.5.6"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[project.scripts]
lerobot-webrtc = "lerobot_webrtc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_webrtc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not hardware_api and not b601_api'"
markers = [
    "hardware_api: installed SO LeRobot drivers with an in-memory motor bus, no physical I/O",
    "b601_api: installed B601 LeRobot driver with a fake MotorBridge, no physical I/O",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
