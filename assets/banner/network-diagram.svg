<svg xmlns="http://www.w3.org/2000/svg" width="386" height="263" viewBox="0 0 386 263" role="img" aria-labelledby="diagram-title diagram-description" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="diagram-title">LeRobot WebRTC joint-data connection</title>
  <desc id="diagram-description">A leader and follower use matching joint schemas. Each endpoint exchanges authenticated SDP with the signaling server over separate dashed links; the signaling server does not carry joint data. The endpoints exchange encrypted joint data over WebRTC, directly peer to peer or through an optional TURN data relay. Joint data only, no video. This is a network diagram, not a hardware action.</desc>
  <defs>
    <linearGradient id="diagram-data-link" gradientUnits="userSpaceOnUse" x1="114" y1="149" x2="272" y2="149">
      <stop stop-color="#ffda62"/>
      <stop offset="0.5" stop-color="#80dcff"/>
      <stop offset="1" stop-color="#80e4bb"/>
    </linearGradient>
  </defs>

  <rect x="0.75" y="0.75" width="384.5" height="261.5" rx="23" fill="#102237" stroke="#29435c" stroke-width="1.5"/>

  <g dominant-baseline="middle">
    <text x="193" y="22" fill="#e1efff" font-size="11" font-weight="650" letter-spacing="1.5">CONNECTION MAP</text>

    <!-- Signaling is a separate setup path, not a joint-data relay. -->
    <g fill="none" stroke="#9db7cd" stroke-width="1.5" stroke-dasharray="5 5" stroke-linecap="round">
      <path d="M119 59H79Q67 59 67 71V105"/>
      <path d="M267 59H307Q319 59 319 71V105"/>
    </g>
    <rect id="diagram-signaling-card" x="119" y="40" width="148" height="38" rx="10" fill="#183049" stroke="#436078"/>
    <text data-card="diagram-signaling-card" x="193" y="52" fill="#e1efff" font-size="10.5" font-weight="650" letter-spacing="0.5">SIGNALING SERVER</text>
    <text data-card="diagram-signaling-card" x="193" y="67" fill="#bdcddd" font-size="10.5">authenticated SDP</text>

    <!-- The solid path is the direct encrypted WebRTC connection. -->
    <path d="M114 149H272" fill="none" stroke="url(#diagram-data-link)" stroke-width="2.5" stroke-linecap="round"/>
    <text x="193" y="128" fill="#80dcff" font-size="12" font-weight="750" letter-spacing="1">WEBRTC</text>
    <circle cx="193" cy="149" r="11" fill="#102237"/>
    <g fill="none" stroke="#80dcff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M189 147V144a4 4 0 0 1 8 0V147"/>
      <rect x="187" y="147" width="12" height="10" rx="2"/>
      <path d="M193 151V153"/>
    </g>
    <text x="193" y="171" fill="#e1efff" font-size="10.2" font-weight="550">encrypted joint data</text>
    <text x="193" y="186" fill="#9db7cd" font-size="9.5">direct P2P</text>

    <!-- TURN is the optional alternate data path, never signaling. -->
    <g fill="none" stroke="#80dcff" stroke-width="1.5" stroke-dasharray="3 5" stroke-linecap="round" stroke-opacity="0.8">
      <path d="M67 189V210Q67 220 77 220H136"/>
      <path d="M319 189V210Q319 220 309 220H250"/>
    </g>
    <rect id="diagram-turn-card" x="136" y="204" width="114" height="32" rx="9" fill="#143044" stroke="#3f6c83"/>
    <text data-card="diagram-turn-card" x="193" y="214" fill="#80dcff" font-size="10.5" font-weight="700" letter-spacing="0.8">TURN</text>
    <text data-card="diagram-turn-card" x="193" y="228" fill="#bdcddd" font-size="9.2">optional data relay</text>

    <rect id="diagram-leader-card" x="20" y="105" width="94" height="84" rx="13" fill="#1b3349" stroke="#675d3d"/>
    <text data-card="diagram-leader-card" x="67" y="119" fill="#ffda62" font-size="11" font-weight="700" letter-spacing="0.7">LEADER</text>
    <g fill="none" stroke="#ffda62" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="50" y="132" width="34" height="23" rx="4"/>
      <path d="M67 155V161M57 161H77M58 146L67 140L76 146"/>
      <g fill="#1b3349">
        <circle cx="58" cy="146" r="2.1"/>
        <circle cx="67" cy="140" r="2.1"/>
        <circle cx="76" cy="146" r="2.1"/>
      </g>
    </g>
    <text data-card="diagram-leader-card" x="67" y="177" fill="#bdcddd" font-size="9.5">matched schema</text>

    <rect id="diagram-follower-card" x="272" y="105" width="94" height="84" rx="13" fill="#15333b" stroke="#3f766b"/>
    <text data-card="diagram-follower-card" x="319" y="119" fill="#80e4bb" font-size="11" font-weight="700" letter-spacing="0.5">FOLLOWER</text>
    <g fill="none" stroke="#80e4bb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="302" y="132" width="34" height="23" rx="4"/>
      <path d="M319 155V161M309 161H329M310 146L319 140L328 146"/>
      <g fill="#15333b">
        <circle cx="310" cy="146" r="2.1"/>
        <circle cx="319" cy="140" r="2.1"/>
        <circle cx="328" cy="146" r="2.1"/>
      </g>
    </g>
    <text data-card="diagram-follower-card" x="319" y="177" fill="#bdcddd" font-size="9.5">matched schema</text>

    <text x="193" y="252" fill="#9db7cd" font-size="9.2" font-weight="600" letter-spacing="1">JOINT DATA ONLY · NO VIDEO</text>
  </g>
</svg>
