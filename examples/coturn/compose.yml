services:
  turn:
    image: coturn/coturn:4.18.0-r0
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf", "--lt-cred-mech"]
    volumes:
      - type: bind
        source: ./turnserver.local.conf
        target: /etc/coturn/turnserver.conf
        read_only: true
        bind:
          create_host_path: false
